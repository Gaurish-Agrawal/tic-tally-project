<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Statistics</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #a7c8f0;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            background-color: #3321bf;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            margin: 10px 0;
        }

        a {
            display: inline-block;
            background-color: #ffffff;
            color: #3321bf;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
            transition: background-color 0.3s, color 0.3s;
        }

        a:hover {
            background-color: #a7c8f0;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Statistics</h1>
        <p>Control Time: {{ timeInSeconds }} Seconds</p>
        <p>Reason: {{ typeDetected }}</p>
        <br>

        <a href="{{ url_for('camera') }}">Retry</a>

        <a href="{{ url_for('landing') }}">Go Back</a>
    </div>
</body>
</html>
