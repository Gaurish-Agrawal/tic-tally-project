<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #a7c8f0;
            color: black;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            padding: 20px;
            text-align: center;
            width: 80%;
            max-width: 800px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        video {
            display: none;
        }

        canvas {
            border: 1px solid #ffffff;
            border-radius: 8px;
            background-color: #000000;
            width: 100%;
            max-width: 640px;
            height: auto;
            margin-bottom: 20px;
        }

        .stats {
            font-size: 30px;
            margin: 10px 0;
        }

        .footer {
            font-size: 16px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Make Sure Face Is Visible</h1>
        <video id="video" width="640" height="480" autoplay></video>
        <canvas id="canvas" width="640" height="480"></canvas>
        <div class="stats" id="blinkCount">Blinks: 0</div>
        <div class="stats" id="stopwatch">Stopwatch: 00:00:00</div>

        <div class="stats" id="timeToBeat">Time to Beat: <span style="color:rgb(23, 59, 157)"><b>{{timeToBeat}} Seconds</b></span></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            startDetection();
        });
    </script>
</body>
</html>
